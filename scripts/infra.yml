name: insurance-infra
services:
  eureka:
    build: ../eureka-server
    ports: ["127.0.0.1:8761:8761"]
  postgres:
    build: ../postgres
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_PASSWORD: lab_pass
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    ports: ["127.0.0.1:9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["elastic-data:/usr/share/elasticsearch/data"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["127.0.0.1:15672:15672", "127.0.0.1:5672:5672"]
    environment:
      RABBITMQ_DEFAULT_USER: lab_user
      RABBITMQ_DEFAULT_PASS: lab_pass
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
volumes:
  postgres-data:
  elastic-data:
  rabbit-data:
